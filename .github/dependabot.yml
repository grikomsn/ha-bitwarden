version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # Base images in bitwarden_lite/Dockerfile (tag + digest).
  # A Bitwarden lite bump also needs `version` in config.yaml and a
  # CHANGELOG.md entry before merging.
  - package-ecosystem: docker
    directory: /bitwarden_lite
    schedule:
      interval: weekly
    groups:
      images:
        patterns: ["*"]
