name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ShellCheck
        run: shellcheck -s sh bitwarden_lite/rootfs/ha/*.sh
      - name: YAML
        run: >-
          yamllint -d '{extends: relaxed, rules: {line-length: disable}}'
          repository.yaml bitwarden_lite/config.yaml bitwarden_lite/translations/ .github/

  version:
    name: Version and changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install checker dependencies
        # awesomeversion is pinned to the version Home Assistant's Supervisor
        # uses to decide whether an update is newer.
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet awesomeversion==25.8.0 PyYAML==6.0.4
      - name: Check version
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BEFORE}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            /tmp/venv/bin/python .github/scripts/check_version.py
          else
            /tmp/venv/bin/python .github/scripts/check_version.py --base "$base"
          fi

  build:
    runs-on: ubuntu-latest
    needs: [lint, version]
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build ${{ matrix.platform }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: bitwarden_lite
          platforms: ${{ matrix.platform }}
          push: false
          load: ${{ matrix.platform == 'linux/amd64' }}
          tags: ha-bitwarden-lite:ci
      - name: Smoke test
        if: matrix.platform == 'linux/amd64'
        run: |
          mkdir -p data
          cat > data/options.json <<EOF
          {"domain":"vault.example.test","installation_id":"$(cat /proc/sys/kernel/random/uuid)","installation_key":"ci","disable_registration":false,"admin_emails":[],"tailscale":false,"tailscale_hostname":"vault","tailscale_funnel":false,"env_vars":[]}
          EOF
          docker run -d --name bw -v "$PWD/data:/etc/bitwarden" -p 8080:8080 ha-bitwarden-lite:ci
          for i in $(seq 1 60); do
            if curl -sf -X POST -H 'Content-Type: application/json' -d '{"email":"ci@example.test"}' \
              http://localhost:8080/identity/accounts/prelogin >/dev/null; then
              echo "identity up after ~$((i * 5))s"; exit 0
            fi
            sleep 5
          done
          docker logs bw
          exit 1
